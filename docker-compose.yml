services:
  frontend:
    build: ./frontend
    container_name: hexlabel-frontend
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./frontend:/app        # mount only the frontend folder
      - /app/node_modules      # keep installed dependencies from the image
    environment:
      - NODE_ENV=development
    restart: unless-stopped
